<!DOCTYPE html>
<html>

<head>
<style>
body {

    min-height: 100vh;

    margin: 0;

    display: flex;

    flex-direction: column;

    font-family: 'Segoe UI', sans-serif;

    background: linear-gradient(
        -45deg,
        #fff3b0,
        #bde0fe,
        #ffc8c8,
        #caffbf
    );

    background-size: 400% 400%;

    animation: backgroundAnimation 40s ease infinite;
}


@keyframes backgroundAnimation {

    0% {
        background-position: 0% 50%;
    }

    25% {
        background-position: 50% 100%;
    }

    50% {
        background-position: 100% 50%;
    }

    75% {
        background-position: 50% 0%;
    }

    100% {
        background-position: 0% 50%;
    }
}

.school-header {

    text-align: center;

    padding: 18px 10px;

    margin-bottom: 25px;

    background-color: #ffffff;

    border-bottom: 1px solid #dddddd;

}


.school-header h2 {

    margin: 0;

    font-weight: bold;

}


.school-header h4 {

    margin-top: 6px;

    margin-bottom: 0;

    font-weight: 600;

}

.main-content {

    flex: 1;

    padding-top: 40px;

    padding-bottom: 40px;
}


.content-card {

    background: rgba(
        255,
        255,
        255,
        0.94
    );

    border-radius: 18px;

    padding: 30px;

    box-shadow:
        0 10px 30px
        rgba(0, 0, 0, 0.20);
}

</style>
<title>

My Substitutions

</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

</head>

<body class="container mt-5">

<div class="main-content">

    <div class="container">

        <div class="content-card">
<header class="school-header">

    <h2>
        ALPHA SCHOOL, CIT NAGAR
    </h2>

    <h4>
        SUBSTITUTION MANAGEMENT SYSTEM
    </h4>

</header>
<div class="mb-3">

<a
href="/teacher_dashboard"
class="btn btn-primary">

🏠 Dashboard

</a>

<a
href="/logout"
class="btn btn-danger">

🚪 Logout

</a>

<button
class="btn btn-secondary"
onclick="history.back()">

← Back

</button>

</div>

<h1>

My Substitutions

</h1>

<table class="table table-bordered table-striped">

<tr>

<th>Date</th>

<th>Day</th>

<th>Period</th>

<th>Class</th>

</tr>

{% for row in substitutions %}

<tr>

<td>

{{ row[0] }}

</td>

<td>

{{ row[1] }}

</td>

<td>

{{ row[2] }}

</td>

<td>

{{ row[3] }}

</td>

</tr>

{% endfor %}

</table>

</div>
</div>
</div>

<footer class="bg-dark text-white text-center mt-5 py-3">

© 2026 All Rights Reserved by S Karthikeyan

</footer>
</body>

</html>
