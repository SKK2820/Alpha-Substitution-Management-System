<!DOCTYPE html>
<html>

<head>

    <title>

        Login

    </title>

    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

    <style>

body{

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    background:
    linear-gradient(
        135deg,
        #021B79,
        #0575E6
    );

    overflow:hidden;

    position:relative;

    font-family:
    'Segoe UI',
    sans-serif;

}

#particles-js{

    position:absolute;

    top:0;

    left:0;

    width:100%;

    height:100%;

    z-index:0;

}


.login-card{

    animation: fadeIn 0.8s ease-out;

    position:relative;

    z-index:10;

    width:475px;

    padding:28px;

    border-radius:20px;

    background:
    rgba(
        255,
        255,
        255,
        0.96
    );

    backdrop-filter:
    blur(10px);

    box-shadow:
    0px 15px 40px
    rgba(
        0,
        0,
        0,
        0.35
    );

}

.school-logo{

    max-height:170px;

    width:auto;

}

.login-btn{

    width:100%;

    font-size:18px;

    font-weight:bold;

    transition:
    0.3s;

    border-radius:10px;

}

.login-btn:hover{

    transform:
    translateY(-2px);

    box-shadow:
    0px 8px 20px
    rgba(
        13,
        110,
        253,
        0.4
    );

}

.form-control{

    height:50px;

    border-radius:10px;

}

.form-control:focus{

    box-shadow:
    0 0 10px
    rgba(
        13,
        110,
        253,
        0.3
    );

}

.input-group .btn{

    border-radius:
    0 10px 10px 0;

}

footer{

    font-size:14px;

}

</style>

</head>

<body>

<div id="particles-js"></div>

<div class="login-card">

    <div class="text-center mb-4">

    <img

    src="{{ url_for(
        'static',
        filename='images/school_logo.png'
    ) }}"

    style="
            height: 280px;
            width: auto;
            "

    class="school-logo"

    alt="School Logo">

    <h5 class="mt-3 text-secondary">

        <b>

            Alpha School CIT Nagar

        </b>

    </h5>

</div>

    <h2 class="text-center">

        <b>

        Alpha Substitution
        Management System

        </b>

    </h2>

    <hr>

    {% with messages =
    get_flashed_messages(
        with_categories=true
    ) %}

    {% if messages %}

    {% for category, message in messages %}

    <div
    class="alert alert-{{ category }}
    alert-dismissible fade show">

        {{ message }}

        <button

        type="button"

        class="btn-close"

        data-bs-dismiss="alert">

        </button>

    </div>

    {% endfor %}

    {% endif %}

    {% endwith %}

    <h4 class="text-center mb-4">

        Login

    </h4>

    <form method="POST">

        <div class="mb-3">

            <label>

                Username:

            </label>

            <input

            type="text"

            name="username"

            class="form-control"

            placeholder="Enter Username"

            required>

        </div>

        <div class="mb-4">

    <label>

        Password

    </label>

    <div class="input-group">

        <input

        type="password"

        name="password"

        id="password"

        class="form-control"

        placeholder="Enter Password"

        required>

        <button

        type="button"

        class="btn btn-outline-secondary"

        onclick="togglePassword()">

            👁

        </button>

    </div>

</div>

        <button
        class="btn btn-primary login-btn">

            Login

        </button>

    </form>

    <hr>

    <footer
    class="text-center text-muted"><b>

        © 2026 All Rights Reserved
        by S Karthikeyan</b>

    </footer>

</div>

<script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>

<script>

particlesJS(

"particles-js",

{

    particles:{

        number:{
            value:80,
            density:{
                enable:true,
                value_area:800
            }
        },

        color:{
            value:"#ffffff"
        },

        shape:{
            type:"circle"
        },

        opacity:{
            value:0.5
        },

        size:{
            value:3,
            random:true
        },

        line_linked:{
            enable:true,
            distance:150,
            color:"#ffffff",
            opacity:0.2,
            width:1
        },

        move:{
            enable:true,
            speed:2,
            direction:"none",
            random:false,
            straight:false,
            out_mode:"out"
        }

    },

    interactivity:{

        detect_on:"canvas",

        events:{

            onhover:{
                enable:true,
                mode:"grab"
            },

            onclick:{
                enable:false
            }

        },

        modes:{

            grab:{
                distance:140,
                line_linked:{
                    opacity:0.5
                }
            }

        }

    },

    retina_detect:true

}

);

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>

function togglePassword(){

    let passwordBox =
    document.getElementById(
        "password"
    );

    if(
        passwordBox.type
        ==
        "password"
    ){

        passwordBox.type =
        "text";

    }

    else{

        passwordBox.type =
        "password";

    }

}

</script>

<script>

setTimeout(

function(){

    let alerts =
    document.querySelectorAll(
        ".alert"
    );

    alerts.forEach(

    function(alert){

        alert.remove();

    });

},

5000

);

</script>

<script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>

</body>

</html>
